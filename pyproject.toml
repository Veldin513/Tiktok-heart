[project]
name = "tiktok-heart"
version = "2.2.0"
description = "Local desktop worker and control shell for TikTok Heart automation."
requires-python = ">=3.12"

[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = [
  ".git",
  ".pytest_cache",
  ".ruff_cache",
  "backups",
  "logs",
  "node_modules",
  "profiles",
  "release",
  "src-tauri/target",
]

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "UP",
  "B",
  "SIM",
]
ignore = [
  "E501",
]

[tool.ruff.lint.isort]
known-first-party = ["yara_app", "scripts", "app_shell"]
